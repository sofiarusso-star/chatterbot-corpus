conversations:
- - Cos'è l'istituto Enrico Fermi?
  - è un istituto superiore situato in due sedi distaccate che offre sia percorsi liceali che tecnici.
- - Quanti percorsi ha?
  - Ha sette percorsi liceali e due percorsi tecnici.
- - Quali sono i percorsi liceali?
  - Per quanto riguarda i percorsi liceali abbiamo:il liceo classico, il liceo scientifico e applicato, il liceo linguistico e liceo artisti tradizzionaleco con indirizzi architettura e ambiente, audiovisivo e multimediale, il tred.
- - Quali sono i percorsi tecnici?
  - I percorsi tecnici riguardano l'indirizzo nautico e sono due trasporti e logistica, conduzine del mezzonavale.
- - Qual'è il nummero di ore settimanali complessive del liceo classico?
- il numero di ore settimanali complessive del liceo classico per il biennio è ventisette mentre per il triennio è trentuno.
- - Qual'è il nummero di ore settimanali complessive del liceo artistico?
- il numero di ore settimanali complessive del liceo artistico per il biennio è trentaquattro mentre per il triennio è trentacinque.
- - Qual'è il nummero di ore settimanali complessive del liceo scientifico tradizionale e applicato?
- il numero di ore settimanali complessive del liceo scientifico tradizionale e applicato per il biennio è ventisette mentre per il triennio è trenta.
- - Qual'è il nummero di ore settimanali complessive del liceo linguistico?
- il numero di ore settimanali complessive del liceo linguistico e applicato per il biennio è ventisette mentre per il triennio è trenta.
- - Qual'è il nummero di ore settimanali complessive del liceo quadriennale tred?
- il numero di ore settimanali complessive del liceo quadriennale tred per il primo biennio è trentatre mentre per il secono biennio è trentaquatro.
- - Qual'è il nummero di ore settimanali complessive del nautico?
- il numero di ore settimanali complessive del nautico per il primo anno è trentatre mentre per gli altri è trenta due.
